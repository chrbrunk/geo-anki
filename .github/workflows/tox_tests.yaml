name: Tox tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tox tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            toxenv: py312
          - python: '3.13'
            toxenv: py313
          - python: '3.14'
            toxenv: py314
          - python: '3.15'
            toxenv: py315
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: python -m pip install 'tox>=4,<5'

      - name: Test wheel
        run: python -m tox -e ${{ matrix.toxenv }}
