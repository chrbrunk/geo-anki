[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geo-anki"
version = "0.1.0"
description = "Map-based Anki flashcards for learning geography"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "genanki>=0.13.1",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
geo_anki = "geo_anki.scripts.run:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "ty>=0.0.94",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geo_anki"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
