[tox]
min_version = 4
env_list = py312, py313, py314, py315

[testenv]
description = Test the installed wheel with independently resolved dependencies
package = wheel
deps = pytest>=8,<10
changedir = {envtmpdir}
setenv =
    MPLCONFIGDIR = {envtmpdir}/matplotlib
commands =
    geo_anki --help
    python -m pytest --import-mode=importlib {toxinidir}/tests {posargs}
